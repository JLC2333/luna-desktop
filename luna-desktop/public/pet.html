<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LunA Pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
    }
    #live2d { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="live2d"></canvas>
  <script src="/live2d/live2dcubismcore.min.js"></script>
  <script src="/live2d/l2d.bundle.js"></script>
  <script>
    // 等待 LunaL2D 就绪，初始化看板娘（无工具栏、无拖拽）
    function initPet() {
      var l2d = window.LunaL2D;
      if (!l2d) { setTimeout(initPet, 100); return; }
      l2d.initialize();
      l2d.run();
      window._l2dApp = l2d;
      window._currentModel = 1;
      l2d.changeModel(1);
    }
    initPet();
  </script>
</body>
</html>
