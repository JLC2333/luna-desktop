name: Build DMG + EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: luna-desktop

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build Windows installer
        run: cargo tauri build --bundles nsis
        working-directory: luna-desktop

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: LunA_Windows_Installer
          path: luna-desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: luna-desktop

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build macOS DMG
        run: cargo tauri build --bundles dmg
        working-directory: luna-desktop

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: LunA_macOS_DMG
          path: luna-desktop/src-tauri/target/release/bundle/dmg/*.dmg
